<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SP Trip 2026 • Carol, Bia & Gabriel</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    @keyframes pop { 0% { transform: scale(.94); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
    .vote-pop { animation: pop .22s ease-out; }
    @keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-in { animation: toastIn .2s ease-out; }
  </style>
</head>
<body class="text-slate-800 antialiased pb-16">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 shrink-0 rounded-xl bg-gradient-to-tr from-pink-500 via-purple-600 to-indigo-600 flex items-center justify-center text-white font-black text-sm">SP</div>
        <div class="min-w-0">
          <h1 class="font-display font-extrabold text-sm sm:text-lg text-slate-900 truncate">Carol, Bia & Gabriel</h1>
          <p class="text-[10px] sm:text-[11px] text-slate-500 font-semibold">São Paulo • 09–12 out 2026</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <nav class="flex items-center bg-slate-100 p-1 rounded-xl">
          <button id="tabPlaces" onclick="switchView('places')" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm">Lugares</button>
          <button id="tabMatches" onclick="switchView('matches')" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900">
            🔥 Matches <span id="matchBadge" class="ml-0.5">0</span>
          </button>
        </nav>
        <button onclick="openAddModal()" class="w-8 h-8 sm:w-auto sm:px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center justify-center gap-1.5" title="Adicionar lugar">
          <i data-lucide="plus" class="w-4 h-4"></i><span class="hidden sm:inline">Adicionar</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-5">
    <section id="viewPlaces" class="space-y-4">
      <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm">
        <div class="flex items-center justify-between gap-3 mb-3">
          <div>
            <h2 class="font-display font-extrabold text-base text-slate-900">Onde a gente quer ir?</h2>
            <p class="text-[11px] text-slate-500 mt-0.5"><span id="placesCount">0</span> lugares • vote no que você toparia</p>
          </div>
          <div id="syncStatus" class="text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg">● conectado</div>
        </div>

        <div class="flex gap-1.5 overflow-x-auto custom-scroll pb-2" id="categoryPills">
          <button data-cat="all" onclick="setCategory('all')" class="cat-pill shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white">Todos <span id="count-all"></span></button>
          <button data-cat="gastro" onclick="setCategory('gastro')" class="cat-pill shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">🍔 Comida</button>
          <button data-cat="night" onclick="setCategory('night')" class="cat-pill shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">🏳️‍🌈 Noite</button>
          <button data-cat="culture" onclick="setCategory('culture')" class="cat-pill shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">🎨 Passeios</button>
          <button data-cat="cafe" onclick="setCategory('cafe')" class="cat-pill shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">☕ Cafés</button>
        </div>

        <div class="relative mt-1">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input id="searchInput" oninput="applyFilters()" type="search" placeholder="Buscar lugar ou bairro..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-pink-500" />
        </div>
      </div>

      <div id="placesContainer" class="space-y-2.5"></div>
    </section>

    <section id="viewMatches" class="hidden space-y-4">
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex items-center justify-between gap-3">
        <div>
          <h2 class="font-display font-extrabold text-lg text-slate-900">🔥 Matches do trio</h2>
          <p class="text-xs text-slate-500 mt-0.5">Entram aqui os lugares com pelo menos 2 votos.</p>
        </div>
        <div class="text-right">
          <div id="matchesCountBig" class="font-display font-extrabold text-2xl text-pink-600">0</div>
          <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wide">aprovados</div>
        </div>
      </div>
      <div id="matchesContainer" class="space-y-2.5"></div>
    </section>
  </main>

  <div id="addModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm p-4 items-center justify-center">
    <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="font-display font-extrabold text-lg text-slate-900">Adicionar lugar</h3>
          <p class="text-[11px] text-slate-500">Só o básico. Dá para editar depois na planilha.</p>
        </div>
        <button onclick="closeAddModal()" class="p-1.5 text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddPlace(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nome *</label>
          <input id="newName" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-500" placeholder="Ex.: Museu, bar, restaurante...">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Categoria</label>
            <select id="newCategory" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
              <option value="gastro">🍔 Comida</option>
              <option value="night">🏳️‍🌈 Noite</option>
              <option value="culture">🎨 Passeio</option>
              <option value="cafe">☕ Café</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Bairro *</label>
            <input id="newRegion" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" placeholder="Pinheiros">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Observação</label>
          <input id="newHighlight" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" placeholder="Por que vale a pena?">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-xs font-bold text-slate-500">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-bold bg-pink-600 hover:bg-pink-700 text-white rounded-xl">Adicionar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="toast-in bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold whitespace-nowrap" id="toastText">Salvo!</div>
  </div>

    const CATEGORY_ORDER = { gastro: 1, culture: 2, cafe: 3, night: 4 };
    const LOCAL_VOTES_KEY = 'sp_trip_votes_simple_v1';
    const LOCAL_CUSTOM_KEY = 'sp_trip_custom_simple_v1';

    let allPlaces = [...DEFAULT_PLACES];
    let userVotes = {};
    let activeCategory = 'all';
    let searchQuery = '';
    let currentView = 'places';
    let isSaving = false;

    document.addEventListener('DOMContentLoaded', async () => {
      loadLocalFallback();
      renderAll();
      lucide.createIcons();
      await loadFromServer();
      setInterval(() => { if (!isSaving) loadFromServer(true); }, 8000);
    });

    function appsScriptAvailable() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function loadLocalFallback() {
      try {
        userVotes = JSON.parse(localStorage.getItem(LOCAL_VOTES_KEY) || '{}');
        const custom = JSON.parse(localStorage.getItem(LOCAL_CUSTOM_KEY) || '[]');
        if (Array.isArray(custom)) {
          custom.forEach(p => {
            if (!allPlaces.some(x => x.id === p.id)) allPlaces.unshift(p);
          });
        }
      } catch (_) {
        userVotes = {};
      }
    }

    function saveLocalFallback() {
      localStorage.setItem(LOCAL_VOTES_KEY, JSON.stringify(userVotes));
      localStorage.setItem(LOCAL_CUSTOM_KEY, JSON.stringify(allPlaces.filter(p => p.isCustom)));
    }

    function serverCall(functionName, ...args) {
      return new Promise((resolve, reject) => {
        if (!appsScriptAvailable()) return reject(new Error('Apps Script indisponível'));
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))
          [functionName](...args);
      });
    }

    async function loadFromServer(silent = false) {
      if (!appsScriptAvailable()) {
        setSyncStatus('modo local', false);
        return;
      }
      try {
        if (!silent) setSyncStatus('sincronizando…', true);
        const state = await serverCall('getAppState');
        const serverPlaces = Array.isArray(state.places) ? state.places : [];
        const serverIds = new Set(serverPlaces.map(p => String(p.id)));
        const missing = DEFAULT_PLACES.filter(p => !serverIds.has(String(p.id)));

        if (missing.length) {
          await serverCall('seedDefaultPlaces', missing);
          const refreshed = await serverCall('getAppState');
          allPlaces = Array.isArray(refreshed.places) && refreshed.places.length ? refreshed.places : [...DEFAULT_PLACES];
          userVotes = refreshed.votes || {};
        } else {
          allPlaces = serverPlaces.length ? serverPlaces : [...DEFAULT_PLACES];
          userVotes = state.votes || {};
        }
        saveLocalFallback();
        renderAll();
        setSyncStatus('● ao vivo', true);
      } catch (err) {
        setSyncStatus('modo local', false);
        if (!silent) showToast('Não consegui sincronizar com a planilha.');
      }
    }

    function setSyncStatus(text, online) {
      const el = document.getElementById('syncStatus');
      el.textContent = text;
      el.className = online
        ? 'text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg'
        : 'text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg';
    }

    function voteCount(placeId) {
      const v = userVotes[placeId] || {};
      return Number(!!v.carol) + Number(!!v.bia) + Number(!!v.gabriel);
    }

    async function toggleVote(placeId, person) {
      if (!userVotes[placeId]) userVotes[placeId] = { carol: false, bia: false, gabriel: false };
      const before = voteCount(placeId);
      userVotes[placeId][person] = !userVotes[placeId][person];
      const value = userVotes[placeId][person];
      const after = voteCount(placeId);
      saveLocalFallback();
      renderAll();

      if (after >= 2 && after > before) {
        if (typeof confetti === 'function') confetti({ particleCount: after === 3 ? 70 : 30, spread: 55, origin: { y: .78 } });
        showToast(after === 3 ? '🎉 MATCH 3/3!' : '🔥 Deu match 2/3!');
      }

      if (!appsScriptAvailable()) return;
      isSaving = true;
      try {
        await serverCall('saveVote', placeId, person, value);
        setSyncStatus('● ao vivo', true);
      } catch (err) {
        showToast('Erro ao salvar o voto. Sincronizando de novo…');
        await loadFromServer(true);
      } finally {
        isSaving = false;
      }
    }

    function renderAll() {
      renderPlaces();
      renderMatches();
      updateCounters();
      lucide.createIcons();
    }

    function updateCounters() {
      const matches = allPlaces.filter(p => voteCount(p.id) >= 2).length;
      document.getElementById('placesCount').textContent = allPlaces.length;
      document.getElementById('count-all').textContent = `(${allPlaces.length})`;
      document.getElementById('matchBadge').textContent = matches;
      document.getElementById('matchesCountBig').textContent = matches;
    }

    function renderPlaces() {
      const container = document.getElementById('placesContainer');
      let items = allPlaces.filter(p => {
        if (activeCategory !== 'all' && p.category !== activeCategory) return false;
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return [p.name, p.region, p.highlight, p.tip].some(x => String(x || '').toLowerCase().includes(q));
      });

      items.sort((a, b) => {
        const votesDiff = voteCount(b.id) - voteCount(a.id);
        if (votesDiff) return votesDiff;
        return (CATEGORY_ORDER[a.category] || 9) - (CATEGORY_ORDER[b.category] || 9) || String(a.name).localeCompare(String(b.name), 'pt-BR');
      });

      if (!items.length) {
        container.innerHTML = emptyState('Nenhum lugar encontrado', 'Tente outro termo ou categoria.');
        return;
      }
      container.innerHTML = items.map(placeCard).join('');
    }

    function renderMatches() {
      const container = document.getElementById('matchesContainer');
      const matches = allPlaces.filter(p => voteCount(p.id) >= 2)
        .sort((a, b) => voteCount(b.id) - voteCount(a.id) || String(a.name).localeCompare(String(b.name), 'pt-BR'));

      if (!matches.length) {
        container.innerHTML = emptyState('Ainda não deu match', 'Quando 2 ou 3 pessoas curtirem o mesmo lugar, ele aparece aqui.');
        return;
      }
      container.innerHTML = matches.map(placeCard).join('');
    }

    function placeCard(p) {
      const v = userVotes[p.id] || { carol: false, bia: false, gabriel: false };
      const count = voteCount(p.id);
      const matched = count >= 2;
      const triple = count === 3;
      const categoryIcon = { gastro: '🍔', night: '🏳️‍🌈', culture: '🎨', cafe: '☕' }[p.category] || '📍';

      return `
        <article class="bg-white rounded-2xl border ${triple ? 'border-pink-300 ring-1 ring-pink-100' : matched ? 'border-purple-200' : 'border-slate-200'} p-3.5 shadow-sm">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-start gap-2">
                <span class="mt-0.5 text-sm">${categoryIcon}</span>
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                    <h3 class="font-display font-bold text-sm text-slate-900">${escapeHtml(p.name)}</h3>
                    ${p.priceTag || p.price ? `<span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">${escapeHtml(p.priceTag || p.price)}</span>` : ''}
                  </div>
                  <p class="text-[11px] text-slate-400 font-semibold mt-0.5">📍 ${escapeHtml(p.region || 'São Paulo')}</p>
                  ${p.highlight ? `<p class="text-[11px] text-pink-600 font-bold mt-1">✨ ${escapeHtml(p.highlight)}</p>` : ''}
                  ${p.tip ? `<p class="text-[11px] text-slate-500 mt-0.5">${escapeHtml(p.tip)}</p>` : ''}
                </div>
              </div>
              ${p.mapsUrl ? `<a href="${escapeAttr(p.mapsUrl)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[11px] font-bold text-indigo-600 hover:underline mt-2 ml-6"><i data-lucide="map-pin" class="w-3 h-3"></i> Abrir no mapa</a>` : ''}
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-2 border-t sm:border-t-0 border-slate-100 pt-3 sm:pt-0">
              <div class="flex gap-1.5 overflow-x-auto">
                ${voteButton(p.id, 'carol', 'Carol', v.carol, 'pink')}
                ${voteButton(p.id, 'bia', 'Bia', v.bia, 'purple')}
                ${voteButton(p.id, 'gabriel', 'Gabriel', v.gabriel, 'indigo')}
              </div>
              <div class="w-[72px] text-right shrink-0">
                ${triple
                  ? '<span class="inline-block text-[10px] font-black text-white bg-pink-600 px-2 py-1 rounded-lg">🎉 3/3</span>'
                  : matched
                    ? '<span class="inline-block text-[10px] font-black text-purple-700 bg-purple-100 px-2 py-1 rounded-lg">🔥 2/3</span>'
                    : `<span class="text-[10px] font-bold text-slate-400">${count ? count + '/3' : '—'}</span>`}
              </div>
            </div>
          </div>
        </article>`;
    }

    function voteButton(placeId, person, label, active, tone) {
      const styles = {
        pink: active ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-slate-500 border-slate-200 hover:bg-pink-50',
        purple: active ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-slate-500 border-slate-200 hover:bg-purple-50',
        indigo: active ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200 hover:bg-indigo-50'
      };
      return `<button onclick="toggleVote('${escapeJs(placeId)}','${person}')" class="${active ? 'vote-pop ' : ''}shrink-0 px-2.5 py-1.5 rounded-xl border text-[11px] font-bold transition ${styles[tone]}">${active ? '♥' : '♡'} ${label}</button>`;
    }

    function emptyState(title, desc) {
      return `<div class="bg-white border border-dashed border-slate-300 rounded-2xl py-12 px-4 text-center"><div class="text-2xl mb-2">🗺️</div><h3 class="font-display font-bold text-sm text-slate-800">${title}</h3><p class="text-xs text-slate-500 mt-1">${desc}</p></div>`;
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        const active = btn.dataset.cat === cat;
        btn.className = `cat-pill shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${active ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
      });
      renderPlaces();
      lucide.createIcons();
    }

    function applyFilters() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderPlaces();
      lucide.createIcons();
    }

    function switchView(view) {
      currentView = view;
      const places = view === 'places';
      document.getElementById('viewPlaces').classList.toggle('hidden', !places);
      document.getElementById('viewMatches').classList.toggle('hidden', places);
      document.getElementById('tabPlaces').className = places
        ? 'px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm'
        : 'px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900';
      document.getElementById('tabMatches').className = !places
        ? 'px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-bold bg-pink-600 text-white shadow-sm'
        : 'px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900';
      if (!places) renderMatches();
      lucide.createIcons();
    }

    function openAddModal() {
      const modal = document.getElementById('addModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => document.getElementById('newName').focus(), 50);
    }

    function closeAddModal() {
      const modal = document.getElementById('addModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function handleAddPlace(event) {
      event.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const category = document.getElementById('newCategory').value;
      const region = document.getElementById('newRegion').value.trim();
      const highlight = document.getElementById('newHighlight').value.trim();
      if (!name || !region) return;

      const place = {
        id: 'custom_' + Date.now(),
        name, category, region,
        price: '', priceTag: '', highlight, tip: '',
        mapsUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + region + ' São Paulo')}`,
        isCustom: true
      };

      allPlaces.unshift(place);
      userVotes[place.id] = { carol: false, bia: false, gabriel: false };
      saveLocalFallback();
      closeAddModal();
      event.target.reset();
      renderAll();
      showToast('Lugar adicionado ✨');

      if (!appsScriptAvailable()) return;
      isSaving = true;
      try {
        await serverCall('addPlace', place);
        await loadFromServer(true);
      } catch (err) {
        showToast('O lugar ficou salvo só neste navegador.');
      } finally {
        isSaving = false;
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    }
    function escapeAttr(value) { return escapeHtml(value); }
    function escapeJs(value) { return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  </script>
</body>
</html>
